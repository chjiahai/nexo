# Nexo — single-service local deployment.
#
# The bot is an OUTBOUND WebSocket client (wss://openws.work.weixin.qq.com);
# it binds no local port, so there is no `ports:` mapping.
# Secrets come from the gitignored .env at the repo root (env_file injects
# them into os.environ, so config.py's os.getenv works even though its
# load_dotenv path lookup no-ops inside the image).

services:
  # Local-dev NATS with JetStream — lets you run `nexo bot` + `nexo drain`
  # (+ `nexo archive` if you have MySQL) against a single node without the full
  # WireGuard cluster. Production runs the 3-node core cluster (see scripts/nats/).
  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data", "-m", "8222"]
    container_name: nexo-nats
    volumes:
      - nats-data:/data
    ports:
      - "4222:4222"   # client (host nats CLI / local bot)
      - "8222:8222"   # monitoring
    restart: unless-stopped
    networks:
      - default

  nexo:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexo:0.1.0
    container_name: nexo
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # `nexo health` checks the heartbeat file written while the WebSocket is
    # connected — reflects real business liveness, unlike `nexo hello` (which
    # only proves the package imports). A dead link is also handled by
    # `restart: unless-stopped` above.
    healthcheck:
      test: ["CMD", "nexo", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - langfuse

  # drain: reads the outbox the bot wrote, uploads media to OBS, publishes rich
  # events to NATS. Shares ./data for the outbox + staging dir. Run alongside
  # `nexo bot` so media archival works end-to-end in local dev.
  drain:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexo:0.1.0
    container_name: nexo-drain
    command: ["nexo", "drain"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - nexo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

networks:
  default:
    # 固定 nexo 项目默认网络的子网，避免 Docker 自动分配 172.18.0.0/16 劫持
    # 公司 172.16/12 段（如真实 MySQL 172.18.12.87）的路由。
    name: nexo_default
    ipam:
      config:
        - subnet: 10.201.0.0/24
  langfuse:
    name: langfuse_default
    external: true

volumes:
  nats-data: