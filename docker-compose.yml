# Nexo — single-service local deployment.
#
# The bot is an OUTBOUND WebSocket client (wss://openws.work.weixin.qq.com);
# it binds no local port, so there is no `ports:` mapping.
# Secrets come from the gitignored .env at the repo root (env_file injects
# them into os.environ, so config.py's os.getenv works even though its
# load_dotenv path lookup no-ops inside the image).

services:
  nexo:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexo:0.1.0
    container_name: nexo
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # `nexo health` checks the heartbeat file written while the WebSocket is
    # connected — reflects real business liveness, unlike `nexo hello` (which
    # only proves the package imports). A dead link is also handled by
    # `restart: unless-stopped` above.
    depends_on:
      - otel-lgtm
    healthcheck:
      test: ["CMD", "nexo", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # OpenTelemetry backend — single container bundling Grafana + Loki + Tempo +
  # Mimir + OTel Collector. Enable export by setting NEXO_OTEL_ENDPOINT in .env
  # (e.g. http://otel-lgtm:4318). Left running even if export is off, since it's
  # harmless and keeps `depends_on` simple.
  otel-lgtm:
    image: grafana/otel-lgtm
    container_name: nexo-otel-lgtm
    ports:
      - "3000:3000"    # Grafana UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
