# NATS core cluster node C
# Runs on the cloud host with WireGuard IP 10.13.11.177.
# See core-a.conf for notes.

listen: 10.13.11.177:4222
# Unique identity in the cluster — required for JetStream cluster mode.
server_name: "core-c"

jetstream {
  store_dir: "/var/lib/nats/jetstream"
  max_file_store: 50GB
}

cluster {
  name: "nexo-cluster"
  listen: 10.13.11.177:6222
  routes: [
    "nats-route://10.13.11.7:6222"
    "nats-route://10.13.11.1:6222"
  ]
}

leafnodes {
  listen: 10.13.11.177:7422
}

http: 10.13.11.177:8222
