# NATS leaf node — runs on desktops + Macbook (intermittent, behind NAT).
# Local clients (including `nexo bot` running on this machine) connect to
# 127.0.0.1:4222; the leaf tunnels to the core cluster. No JetStream here —
# persistence lives on the core cluster's 3 nodes.
#
# All three core nodes listed as remotes, tried in order — connect to the first
# reachable, fail over to the next on disconnect. A disconnected leaf keeps
# serving local clients and resyncs on reconnect.
# IMPORTANT: list them as a SINGLE remote with a `urls` array, NOT three
# separate remotes entries. Separate entries open 3 simultaneous links into the
# same full-mesh cluster → NATS loop detection closes them (Protocol Violation).
# A single remote + urls[] connects to one at a time and fails over on disconnect.
# Run:  nats-server -c /etc/nats/nats-server.conf

listen: 127.0.0.1:4222

leafnodes {
  remotes: [
    { urls: ["nats-leaf://10.13.11.7:7422", "nats-leaf://10.13.11.1:7422", "nats-leaf://10.13.11.177:7422"] }
  ]
}
