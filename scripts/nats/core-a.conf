# NATS core cluster node A
# Runs on the cloud host with WireGuard IP 10.13.11.7.
# Mount /var/lib/nats on a dedicated disk for JetStream.
# Run:  nats-server -c /etc/nats/nats-server.conf
#
# NOTE: no authorization block — traffic is encrypted by WireGuard. Add an
# `authorization {}` (or nsc JWT auth) if any client connects outside the WG mesh.

listen: 10.13.11.7:4222
# Unique identity in the cluster — required for JetStream cluster mode.
server_name: "core-a"

jetstream {
  store_dir: "/var/lib/nats/jetstream"
  max_file_store: 50GB
}

cluster {
  name: "nexo-cluster"
  listen: 10.13.11.7:6222
  # All three core peers (including self).
  routes: [
    "nats-route://10.13.11.17:6222"
    "nats-route://10.13.11.177:6222"
  ]
}

# Accept leaf-node connections from desktops / Macbook.
leafnodes {
  listen: 10.13.11.7:7422
}

# Monitoring endpoint: http://10.13.11.7:8222
http: 10.13.11.7:8222
